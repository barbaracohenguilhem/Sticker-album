    title: "Pure geo grid library + tests"
    description: "Rung: new code (no stdlib or dependency gives deterministic grid places). Create lib/geo.ts per game-contracts and tests/geo.test.ts. Pure TS with type-only imports from lib/types.ts. Re-implement a hash + mulberry32-style RNG locally (do not import it). Portuguese names/blurbs per kind; weighted kinds covering all 7 PlaceKinds; place inset inside its cell; spawn probability per cell per 10-minute window."
    wave: 1
    depends_on: []
    agent: "gem-implementer"
    status: "pending"
    retries_used: 0
    context_cluster: "game-contracts"
    acceptance_criteria:
      - "lib/geo.ts exports every symbol listed in shared_context game-contracts (lib/geo.ts entry) with those signatures, and has only type imports."
      - "Haversine tests: (0,0)->(0,1) is ~111195 m +-0.5%; symmetric; 0 for the same point."
      - "Determinism tests: two placesNear((-23.5614,-46.6559),500) calls are deep-equal; every place id round-trips through parsePlaceId; cellOf(place.lat,place.lng) equals its id cell."
      - "parsePlaceId rejects 'quiosque', 'geo:1', 'geo:a:b', 'geo:1.5:2', 'geo:1:2:3', and 'geo:99999999999999999999:0'."
      - "All 7 PlaceKinds appear within 2 km of (-23.5614,-46.6559). artista and causa have visitTroco 0; every other kind has 8."
      - "At least 1 place lies within 150 m of (-23.5614,-46.6559). Every placesNear(...,500) result is within 500 m, and the count is between 5 and 80."
      - "Spawns: same window gives deep-equal spawnsNear; ids include the window; spawnFromId round-trips; adjacent windows give different id sets; spawnWindow boundary is tested."
      - "`npx tsx --test tests/geo.test.ts` exits 0."
      - "`npx tsc --noEmit` reports no errors in lib/geo.ts or tests/geo.test.ts."
    handoff:
      constraints:
