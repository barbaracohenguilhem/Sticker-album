plan_id: "20261111-mapa-geolocalizado"
status: "pending"
tldr: |
  Turn "Dois álbuns" into a Pokémon Go-style map game and keep the sticker domain behind a HUD.
  W1: pure grid geo lib (lib/geo.ts) || MapLibre map + player location (GPS/Simulado).
  W2: server domain rewire (geo places, server-side proximity on approach/buySlot/buyPage/catch, SQLite migration, migrated tests) || game HUD shell (persistent map, overlay routes, "Voltar ao mapa").
  W3: map gameplay (holograma/solid places, bottom-sheet loja, wild spawns + catch, final gates) || read-only critic review of server rules.
  W4: mobile browser verification at 390x844 with ?sim=1.
created_at: "2026-11-11T21:40:33-03:00"
created_by: "gem-planner"
revision: 1
replan_count: 0
planner_revision_used: false

decisions:
  - "lib/geo.ts is pure (type-only imports, own seeded RNG). Client and server derive the same places and spawns from it. The server trusts only the id and {lat,lng} that the client sends."
  - "A geo place is materialized into world.places (with lat/lng), and its spinner for the day is generated, only on a proximity-validated approach. loadWorld no longer spins every place daily, which prevents unbounded spinner growth and unauthenticated materialization of arbitrary cells. Trade-off: a place's daily spinner appears only after the player approaches it that day."
  - "RECIPES are re-keyed by PlaceKind instead of place id. buyPage is gated on the presence place having kind 'papelaria' instead of id 'papelaria'."
  - "The 7 legacy abstract places (rows with NULL lat/lng) are pruned on load, together with their spinner slots, their unsold balcão instances, and any presence pointing at them. Owned instances keep shopId/originLabel as provenance. seedWorld seeds zero places."
  - "Catch dedupe uses the deterministic instance id catch-<userId>-<spawnId>, persisted in the instances table (no action deletes instances). This avoids a users-table schema change."
  - "Catch accepts the current spawn window and the one just before it (grace at the boundary). Older windows are rejected as expired."
  - "Distance gate: the server allows haversine <= INTERACT_RADIUS_M (40) + GPS_TOLERANCE_M (10). The client uses 40 m for holograma vs solid and for enabling buttons."
  - "GameMap is mounted once in Shell (persistent, client-only via next/dynamic ssr:false). Bolso/Caderno/Mercado/Tabela keep their existing routes and render as full-screen overlay panels above the map. This reuses the pages unchanged and keeps map/position state when returning."
  - "T3 changes the Action payloads, so T3 also retires app/loja/[id] (server redirect to '/') to keep tsc green. The loja UI moves to components/place-sheet.tsx in T5."
  - "The DB path can be overridden with env ALBUM_DB_FILE (default data/album.sqlite). This exists only so tests/db.test.ts can exercise the legacy-schema migration on a temp file."
  - "npm run build is verified in an isolated copy (/tmp/sa-build). The user's next dev on :3000 shares .next, and an in-place build would break it."
  - "Wave 3 runs a read-only gem-reviewer critic pass on the server rules (critic_signals: architecture) next to the last code task, so server findings surface before UI verification."
  - "There is no gem-researcher task: .cursor/agents/album-reviewer.md and planner discovery already fix all boundaries, and the contracts live in shared_context."

assumptions:
  - "The pivot keeps the sticker domain; only structure/navigation and the place model change."
  - "Places are procedural grid places, not real-world POIs (no external POI API)."
  - "Anti-spoofing beyond the server distance check is out of scope."
  - "The Node runtime (v26) supports node:sqlite, which lib/db.ts already uses."
  - "The dev/test browser can reach tiles.openfreemap.org. The HUD, markers, and actions must still work if tiles fail."
  - "No action deletes world.instances (lib/logic.ts only reads/filters them)."
  - "The browser test may run approach/buy/catch against the live dev DB after a /tmp backup. Reset is not clicked live; tests/db.test.ts covers it."
  - "Grid density can be tuned so at least one place lies within 150 m of the simulated start."

shared_context:
  game-contracts:
    - "lib/geo.ts (producer T1) exports: type LatLng={lat:number;lng:number}; INTERACT_RADIUS_M=40; GPS_TOLERANCE_M=10; VISIBLE_RADIUS_M=500; SPAWN_WINDOW_MS=600000; CELL_DEG (~0.0015); haversineMeters(a,b):number; withinReach(player,target):boolean (<= 40+10); cellOf(lat,lng)->{cx,cy}; placeForCell(cx,cy)->GeoPlace|null; parsePlaceId(id)->{cx,cy}|null (strict /^geo:(-?\\d+):(-?\\d+)$/, safe integers); placeFromId(id)->GeoPlace|null; placesNear(center,radiusM=500)->GeoPlace[]; spawnWindow(at:Date|number)->number; spawnForCell(cx,cy,window)->GeoSpawn|null; parseSpawnId(id)/spawnFromId(id) for 'spawn:<cx>:<cy>:<window>'; spawnsNear(center,radiusM,at)->GeoSpawn[]."
    - "GeoPlace = Place fields {id:'geo:<cx>:<cy>', kind:PlaceKind, name (pt-BR), blurb (pt-BR), open:true, visitTroco: artista|causa ? 0 : 8} + {lat,lng} inside its own cell. GeoSpawn = {id, cx, cy, window, lat, lng, roll:number in [0,1), material:'gelatina'|'holografico'}."
    - "After T3: Place gains lat:number; lng:number. Action approach {placeId,lat,lng}; buySlot {slotId,lat,lng}; buyPage {lat,lng}; new catch {spawnId,lat,lng}. lib/logic.ts exports spawnArchetype(world,spawn)->Archetype (common pool, deterministic from roll) and caughtInstanceId(userId,spawnId)->'catch-<userId>-<spawnId>' for client reuse."
    - "Player location (producer T2) in components/player-location.tsx: 'use client'; PlayerLocationProvider; usePlayerLocation()->{position:LatLng|null, mode:'gps'|'sim', accuracy:number|null, step(dir:'n'|'s'|'e'|'w')}; SIM_START={lat:-23.5614,lng:-46.6559}; STEP_M=5; sim position persisted in sessionStorage."
    - "Map (producer T2) in components/game-map.tsx: 'use client', default export GameMap; maplibre-gl loaded client-side only; renders a full-viewport map, avatar, 40 m ring, GPS/Simulado badge, and sim d-pad; dev-only window.__mapa = { map } for tests."
    - "Layering (z-index): map 0; map overlays 10 (badge top-left below HUD, d-pad bottom-left); HUD 20 (top bar, bottom round menu button); place/spawn sheet 30; route overlay panel 40; notice toast 50. Touch targets >= 44px; respect env(safe-area-inset-*)."
    - "Legacy code map and invariants: .cursor/agents/album-reviewer.md. Old loja UI for reuse: git show HEAD:app/loja/[id]/page.tsx."
    - "Global constraints: work in place on main; no commits/branches/stashes/pushes; do not touch .claude-flow/; never kill the user's next dev on :3000; never run next build in the repo root; Portuguese UI copy with existing vocabulary (troco, calçada, holograma, bolso, caderno, spinner, fantasma)."

tasks:
