        - "Must not edit lib/geo.ts (owned by T1; report needed changes as needs_revision), components/*, app/layout.tsx, app/globals.css, app/page.tsx, or app/album|caderno|mercado|tabela (T4 runs in parallel)."
        - "Keep all non-place domain rules intact; migrate place tests and never delete them."
        - "perform must keep refusing reset; reset stays in applyAction."
        - "Never trust client-sent place/spawn data beyond the id + lat/lng."
        - "No commits/branches/stashes/pushes; do not touch .claude-flow/; never kill the dev server on :3000."
      relevant_context:
