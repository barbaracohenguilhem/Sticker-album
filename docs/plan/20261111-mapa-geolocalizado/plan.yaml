  - id: "T3-server-geo-domain"
    title: "Server domain rewire: geo places, proximity validation, catch, SQLite migration"
    description: "Rung: reuse perform/apply/saveWorld; new code only for geo validation, catch, and migration. Wire lib/geo.ts into lib/types.ts, lib/logic.ts, and lib/db.ts. Enforce proximity on the server, add the catch action, migrate the legacy SQLite file, migrate (not delete) the place tests, add db migration tests, harden the act route, and retire app/loja/[id]."
    wave: 2
    depends_on:
      - "T1-geo-lib"
    agent: "gem-implementer"
    status: "pending"
    retries_used: 0
    context_cluster: "game-contracts"
    acceptance_criteria:
      - "lib/types.ts: Place has lat/lng; approach, buySlot, and buyPage actions carry lat,lng; new {type:'catch';spawnId;lat;lng} action."
      - "apply rejects a non-finite or out-of-range lat/lng with a pt-BR error for approach, buySlot, buyPage, and catch."
      - "approach resolves the place via placeFromId(placeId) only, never from client fields. An unknown, malformed, or legacy id ('quiosque', empty cell) throws 'Não existe esse lugar.'"
      - "approach rejects distance > 50 m with a pt-BR error and no state change. placeIsOpen still gates it (feira only on Saturdays in America/Sao_Paulo)."
      - "approach materializes or refreshes the place in world.places with lat/lng and generates the day's spinner for that place only (ensureSpinner scoped by day + placeId; RECIPES keyed by kind). Calçada troco is paid once per user per place per dayKey; presence is set."
      - "buySlot requires presence === slot.shopId and distance to that place <= 50 m. buyPage requires the presence place to have kind 'papelaria' and distance <= 50 m. Price, free pocket, sold-once, PAGE_LIMIT, and PAGE_PRICE rules are unchanged."
      - "catch looks up the spawn with spawnFromId (pt-BR error if missing). The window must be the current or previous spawnWindow(at), otherwise an expired error. It also rejects distance > 50 m, an existing instance catch-<user>-<spawnId>, and a full bolso."
      - "A successful catch mints one instance: spawnArchetype(world,spawn), spawn.material, condition 'novo', home 'moeda', the free pocket, owner = active user, pt-BR originLabel (e.g. 'Solto na rua'), and one history entry."
      - "seedWorld seeds zero places, and loadWorld no longer spins all places. syncPlaces re-derives seed fields of materialized geo places from lib/geo.ts and keeps visits and spinner."
      - "A pure migrate step drops places without lat/lng plus their spinner slots, unsold balcão instances, and presence pointing at them, and keeps owned instances."
      - "lib/db.ts: the places schema includes lat REAL and lng REAL. connection() adds missing columns via PRAGMA table_info(places) + ALTER TABLE, and saveWorld/readWorld persist lat/lng. The file path is process.env.ALBUM_DB_FILE ?? data/album.sqlite. The applyAction reset behavior is unchanged."
      - "app/api/act/route.ts returns 400 with a pt-BR error for invalid JSON or a body without a string type, and never crashes."
      - "app/loja/[id]/page.tsx becomes a server component that calls redirect('/')."
      - "tests/rules.test.ts keeps all 9 original scenarios, migrated to geo places: seed, syncPlaces, viagem approach + spinner, artista/causa 0 troco, calçada once per day + closed feira, Saturday feira, buySlot presence + sold-once, stick/unstick/movePocket, resale/reprint."
      - "New proximity tests in tests/rules.test.ts: approach is rejected far and accepted near; place-id forgery is rejected ('quiosque', empty cell, malformed, valid id with far coords); buySlot and buyPage are rejected when far; perform does not mutate its input."
      - "New catch tests in tests/rules.test.ts: catch succeeds once per spawn; a second catch of the same spawn errors; a bolso with 12 filled pockets errors with no mint; far, expired, and forged spawn ids are rejected."
      - "tests/db.test.ts builds a legacy-schema SQLite file in os.tmpdir (old places table without lat/lng, legacy rows), points ALBUM_DB_FILE at it, and dynamic-imports lib/db. loadWorld succeeds, lat/lng columns exist, legacy places are pruned, and owned instances are intact."
      - "tests/db.test.ts also asserts that an applyAction catch persists across a fresh loadWorld and that applyAction({type:'reset'}) reseeds."
      - "package.json scripts.test is 'tsx --test tests/rules.test.ts tests/geo.test.ts tests/db.test.ts', and `npm test` exits 0."
      - "`npx tsc --noEmit` reports no errors in T3-owned files."
      - "Live DB check: first copy data/album.sqlite to /tmp/album.sqlite.pre-geo. Then `curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/world` returns 200 and every returned place has numeric lat/lng."
    handoff:
